[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scii-gate"
version = "0.1.0"
description = "Гейт допуска обновлений ПО КФС по графу доказательств целостности цепочки сборки (метод SCII)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Alexander Kuzmin"}]
dependencies = []

[project.optional-dependencies]
ardupilot = ["pymonocypher==3.1.3.2"]
test = ["pytest>=8", "pymonocypher==3.1.3.2"]

[project.scripts]
scii-gate = "scii.gate:main"

[tool.setuptools]
packages = ["scii"]

[tool.pytest.ini_options]
testpaths = ["tests"]
