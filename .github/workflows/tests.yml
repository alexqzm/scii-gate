# Модульные тесты гейта: модель (числа статьи ВАК-2) и проверки свидетельств.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v2.4.1   # та же версия, что на стенде

      - name: Зависимости (версии и хэши закреплены)
        run: python -m pip install --require-hashes -r ci/requirements-tests.txt

      - name: Модульные тесты
        run: python -m pytest -q tests/

      - name: Решения по записям статьи ВАК-2
        run: |
          python -m scii evaluate --profile profiles/vak2_example.json --states tests/states_vak2_scenario1.json \
            --md vak2_scenario1.md || true
          cat vak2_scenario1.md >> "$GITHUB_STEP_SUMMARY"
